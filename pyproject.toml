[project]
name = "semesteria-backend"
version = "0.1.0"
description = "Django REST API for the Semesteria hiring dashboard assignment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-cors-headers>=4.9.0,<5",
    "django-jazzmin>=3.0.5,<4",
    "djangorestframework>=3.18.3,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "drf-yasg>=1.21.17,<2",
    "psycopg2-binary>=2.9.13,<3",
    "python-dotenv>=1.2.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-django>=4.11.0,<5",
]
